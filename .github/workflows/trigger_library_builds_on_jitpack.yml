name: Trigger Lift Library Builds on Jitpack

on:
  release:
    types:
      - published

jobs:
  trigger-lift-library-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Set vars
        run: echo "LIFT_LIB_VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV # Do not include "v" prefix
      - name: Echo release
        run: echo "Triggering lift library builds on jitpack for '$LIFT_LIB_VERSION' release after waiting for 3 mins"
      - name: Trigger lift library builds on jitpack
        run: |
          sleep 180 # It will take some time for the new tag to be detected by Jitpack
          curl --max-time 600 --no-progress-meter "https://jitpack.io/com/lift/lift-app/terminal-emulator/$LIFT_LIB_VERSION/terminal-emulator-$LIFT_LIB_VERSION.pom"
          curl --max-time 600 --no-progress-meter "https://jitpack.io/com/lift/lift-app/terminal-view/$LIFT_LIB_VERSION/terminal-view-$LIFT_LIB_VERSION.pom"
          curl --max-time 600 --no-progress-meter "https://jitpack.io/com/lift/lift-app/lift-shared/$LIFT_LIB_VERSION/lift-shared-$LIFT_LIB_VERSION.pom"
